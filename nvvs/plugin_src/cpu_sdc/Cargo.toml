[package]
name = "cpu_sdc"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish = false
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mocked_cpu_sdc"
path = "src/bin/mocked_cpu_sdc.rs"
bench = false

[build-dependencies]
dcgm-bindgen = {workspace = true}

[dependencies]
child_process = { workspace = true }
dcgm-logging = { workspace = true }
dcgm_utils = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
child_process = { workspace = true, features = ["mock"] }

[lints]
workspace = true
