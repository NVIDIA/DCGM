[package]
name = "child_process"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
mock = ["dep:mockall"]
# When not set, ensure_child_subreaper() is a no-op.
# Enables PR_SET_CHILD_SUBREAPER on every spawn.
subreaper = []

[dependencies]
dcgm-logging = { workspace = true }
dcgm_utils = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
mockall = { workspace = true, optional = true }
nix = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[lints]
workspace = true
