[features]
default = ["std"]
std = []

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(manual_codegen_check)"]
level = "warn"
priority = 0

[package]
authors = ["comex <comexk@gmail.com>", "Fenhl <fenhl@fenhl.net>", "Adrian Taylor <adetaylor@chromium.org>", "Alex Touchet <alextouchet@outlook.com>", "Daniel Parks <dp+git@oxidized.org>", "Garrett Berg <googberg@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["command-line-interface", "parser-implementations"]
description = "Split a string into shell words, like Python's shlex."
edition = "2018"
license = "MIT OR Apache-2.0"
name = "shlex"
readme = "README.md"
repository = "https://github.com/comex/rust-shlex"
rust-version = "1.46.0"
version = "2.0.1"
