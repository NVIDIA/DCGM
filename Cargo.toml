[workspace.dependencies]
child_process = { path = "rust/child-process" }
dcgm-bindgen = { path = "rust/dcgm-bindgen" }
dcgm-logging = { path = "rust/dcgm-logging" }
dcgm_utils = { path = "rust/dcgm_utils" }
arc-swap = "1.9.2"
bindgen = "0.72.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["default", "cargo", "color", "derive", "env", "error-context", "std", "suggestions", "usage", "wrap_help", "help"] }
futures = "0.3.32"
libc = "0.2.186"
log = "0.4.33"
mockall = "0.15.0"
nix = { version = "0.31.3", features = ["fs", "user"] }
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serial_test = { version = "3.5.0", features = ["default", "file_locks"] }
simple_logger = { version = "5.2.0", default-features = false, features = ["timestamps"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "process", "io-util", "time", "macros", "sync", "net"] }
tokio-util = { version = "0.7.18", features = ["codec"] }

# Profile used for source-based coverage builds (cargo-llvm-cov, driven by the
# CMake cargo-llvm-cov-* targets under `build.sh --coverage`). Inherits `dev` so
# optimization stays off and full debug info is retained -- both are required for
# faithful line/region mapping under `-Cinstrument-coverage`. Keeping it separate
# from `dev`/`release` means coverage runs are independent of whether the caller
# passed `--debug` or `--release`.
[profile.coverage]
inherits = "dev"
debug = true
