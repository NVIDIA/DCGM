[workspace]
members = [
    "nvvs/plugin_src/cpu_sdc",
    "rust/child-process",
    "rust/dcgm-bindgen",
    "rust/dcgm-logging",
    "rust/dcgm_utils",
    "rust/module_log_test",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["NVIDIA Corporation"]
edition = "2024"
license = "Apache-2.0"
categories = ["gpu", "monitoring", "performance", "diagnostics", "health"]
keywords = ["nvidia", "dcgm", "monitoring", "utilities", "gpu", "performance", "diagnostics", "health"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
cargo = "deny"
nursery = "deny"
pedantic = "deny"
# Production code must not use .expect(), panic!(), or .unwrap().
# Tests may opt in to these by adding a local #![allow(...)] attribute.
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

# Settings for cargo vendor-filterer. Used to remove vendored crates for other
# platforms
[workspace.metadata.vendor-filter]
platforms = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
tier = "1"
all-features = true
keep-dep-kinds = "no-dev"
exclude-crate-paths = [
    { name = "*", exclude = "**/tests" },
    { name = "*", exclude = "**/windows" },
    { name = "*", exclude = "*.dll" },

    { name = "libc-0.2.189", exclude = "src/fuchsia" },
    { name = "libc-0.2.189", exclude = "src/new/aix" },
    { name = "libc-0.2.189", exclude = "src/new/apple" },
